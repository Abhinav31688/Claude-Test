<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProjectPulse</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar">
  <div class="sidebar-header">
    <span class="logo">&#9670; ProjectPulse</span>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-btn active" data-view="dashboard">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>
      Dashboard
    </button>
    <button class="nav-btn" data-view="projects">
      <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.44.18-.88.18-1.33C18 2.53 15.96.5 13.5.5c-1.3 0-2.48.56-3.33 1.44L9 3.09 7.83 1.94C6.98 1.06 5.8.5 4.5.5 2.04.5 0 2.53 0 4.67 0 5.12.11 5.56.18 6H2C.9 6 0 6.9 0 8v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
      Projects
    </button>
    <button class="nav-btn" data-view="rewards">
      <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V18H9v2h6v-2h-2v-2.1a5.01 5.01 0 003.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zm-2 3c0 1.65-1.35 3-3 3s-3-1.35-3-3V5h6v3z"/></svg>
      Rewards
    </button>
  </nav>

  <div class="sidebar-projects" id="sidebarProjectList"></div>
</aside>

<!-- ===== MAIN ===== -->
<main class="main">

  <!-- DASHBOARD VIEW -->
  <section class="view active" id="view-dashboard">
    <header class="view-header">
      <h1>Dashboard</h1>
      <button class="btn-primary" id="dashNewProject">+ New Project</button>
    </header>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="section-title">Upcoming Deadlines</div>
    <div class="deadline-list" id="upcomingDeadlines"></div>

    <div class="section-title">Recent Activity</div>
    <div class="activity-list" id="activityList"></div>
  </section>

  <!-- PROJECTS VIEW -->
  <section class="view" id="view-projects">
    <header class="view-header">
      <h1>Projects</h1>
      <button class="btn-primary" id="projNewProject">+ New Project</button>
    </header>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>

  <!-- REWARDS VIEW -->
  <section class="view" id="view-rewards">
    <header class="view-header">
      <h1>Rewards</h1>
    </header>
    <div class="rewards-summary" id="rewardsSummary"></div>
    <div class="section-title">Badges Earned</div>
    <div class="badges-grid" id="badgesGrid"></div>
    <div class="section-title">Points History</div>
    <div class="points-history" id="pointsHistory"></div>
  </section>

  <!-- PROJECT DETAIL VIEW -->
  <section class="view" id="view-project-detail">
    <header class="view-header">
      <button class="btn-back" id="backBtn">&#8592; Back</button>
      <div class="project-detail-title">
        <h1 id="detailProjectName"></h1>
        <span class="deadline-badge" id="detailDeadline"></span>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" id="addMilestoneBtn">+ Milestone</button>
        <button class="btn-danger-sm" id="deleteProjectBtn">Delete</button>
      </div>
    </header>
    <p class="project-description" id="detailDescription"></p>
    <div class="progress-bar-wrap">
      <div class="progress-bar-label">
        <span>Progress</span>
        <span id="detailProgress">0%</span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="detailProgressBar"></div></div>
    </div>
    <div class="milestones-list" id="milestonesList"></div>
  </section>

</main>

<!-- ===== MODALS ===== -->

<!-- New/Edit Project Modal -->
<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="projectModalTitle">New Project</h2>
      <button class="modal-close" data-close="projectModal">&times;</button>
    </div>
    <div class="modal-body">
      <label>Project Name <span class="req">*</span></label>
      <input type="text" id="pmName" placeholder="e.g. Website Redesign" />

      <label>Description</label>
      <textarea id="pmDesc" rows="3" placeholder="What is this project about?"></textarea>

      <label>Deadline <span class="req">*</span></label>
      <input type="date" id="pmDeadline" />

      <label>Priority</label>
      <select id="pmPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="projectModal">Cancel</button>
      <button class="btn-primary" id="saveProjectBtn">Save Project</button>
    </div>
  </div>
</div>

<!-- New/Edit Milestone Modal -->
<div class="modal-overlay" id="milestoneModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="milestoneModalTitle">New Milestone</h2>
      <button class="modal-close" data-close="milestoneModal">&times;</button>
    </div>
    <div class="modal-body">
      <label>Milestone Name <span class="req">*</span></label>
      <input type="text" id="mmName" placeholder="e.g. Design Phase" />

      <label>Deadline <span class="req">*</span></label>
      <input type="date" id="mmDeadline" />
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="milestoneModal">Cancel</button>
      <button class="btn-primary" id="saveMilestoneBtn">Save Milestone</button>
    </div>
  </div>
</div>

<!-- New/Edit Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="taskModalTitle">New Task</h2>
      <button class="modal-close" data-close="taskModal">&times;</button>
    </div>
    <div class="modal-body">
      <label>Task Name <span class="req">*</span></label>
      <input type="text" id="tmName" placeholder="e.g. Create wireframes" />

      <label>Deadline</label>
      <input type="date" id="tmDeadline" />

      <label>Reminder (minutes before deadline)</label>
      <select id="tmReminder">
        <option value="0">No reminder</option>
        <option value="60">1 hour before</option>
        <option value="1440" selected>1 day before</option>
        <option value="4320">3 days before</option>
        <option value="10080">1 week before</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="taskModal">Cancel</button>
      <button class="btn-primary" id="saveTaskBtn">Save Task</button>
    </div>
  </div>
</div>

<!-- Reward Toast -->
<div class="reward-toast" id="rewardToast">
  <div class="toast-icon">&#127942;</div>
  <div class="toast-content">
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
